<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#151413"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#1c1b1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- brand wordmark -->
  <circle cx="94" cy="120" r="13" fill="#d97757"/>
  <text x="118" y="131" fill="#e8e6e3" font-family="Manrope, system-ui, sans-serif" font-weight="800" font-size="30">Scratch<tspan fill="#d97757">Node</tspan></text>
  <!-- hero headline (matches the landing) -->
  <text x="78" y="300" fill="#f0eeec" font-family="Manrope, system-ui, sans-serif" font-weight="800" font-size="60" letter-spacing="-1.5">The room remembers everything.</text>
  <!-- supporting copy -->
  <text x="80" y="356" fill="#a8a5a0" font-family="Manrope, system-ui, sans-serif" font-weight="500" font-size="25">Drop a code, chat live, /ask for sourced answers —</text>
  <text x="80" y="392" fill="#a8a5a0" font-family="Manrope, system-ui, sans-serif" font-weight="500" font-size="25">and walk away with a wiki of the whole event.</text>
  <!-- url pill -->
  <rect x="80" y="452" width="208" height="50" rx="12" fill="#d97757"/>
  <text x="184" y="484" text-anchor="middle" fill="white" font-family="Manrope, system-ui, sans-serif" font-weight="600" font-size="18">scratchnode.live</text>
  <!-- footer -->
  <text x="80" y="558" fill="#6b6864" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="400" font-size="15">no account · no app · public by default</text>
</svg>
