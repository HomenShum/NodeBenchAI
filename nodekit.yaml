# NodeBenchAI brownfield registration. This file describes the repository as it
# operates today; it does not move source files or replace the production runtime.
schemaVersion: nodekit.repo/v1
repository: HomenShum/NodeBenchAI
lifecycle: production
support: active
role: domain-application
commandProfile: untracked

# NodeBenchAI is not a canonical owner in the current platform registry. Its
# existing harness is a migration source for NodeAgent rather than a new owner.
canonicalFor: []
consumes: []

commands:
  dev:
    script: dev
    mode: service
  check:
    script: test:run
    mode: finite
  proof:
    script: verify-live
    mode: finite

noKey:
  status: missing
  command: null
  externalAccountsRequired: 2
  disclosure: >-
    The production-backed NodeBench application currently requires a configured
    Convex deployment and Google model credentials. A deterministic no-key application
    demo remains a migration task; existing local test fixtures are not presented
    as that demo.

environment:
  contractVersion: nodeplatform.env/v1
  status: legacy

proof:
  command: npm run verify-live
  receiptSchema: null

# This DeepTrace type is a domain specialization that happens to share the
# canonical PolicyContext signature; it is not a second runtime policy owner.
contractDeclarations:
  - concept: nodeagent.policy-context
    signature: policy-context
    path: convex/domains/deepTrace/dimensionModel.ts
    mode: domain-specialization
    origin: nodeagent.policy-context
    reason: DeepTrace scoring context, not the NodeAgent runtime policy contract.
architectureExceptions: []
