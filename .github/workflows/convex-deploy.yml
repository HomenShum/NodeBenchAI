name: Convex Deploy

# Decoupled Convex deploy. Replaces the old coupled
# `npx convex deploy --cmd 'npm run build'` invocation that ran inside
# Vercel's build container — that pattern fed Convex bundle failures
# (uuid missing dep, @openai/agents-core zod regression) into the
# frontend deploy and blocked it.
#
# Now Convex deploy and Vercel frontend deploy run in parallel on every
# push to main. A failure in one does not block the other; rollback is
# independent.
#
# Required repo secrets:
#   - CONVEX_DEPLOY_KEY (already exists in Vercel env; mirror to GHA)
#
# Note: Convex push (~30-60s) typically finishes before Vercel build
# (~3-4min) so new functions are available before the frontend that
# calls them. Race window is small and acceptable for the velocity
# trade-off; if it ever bites, we can re-couple by gating Vercel deploy
# on this workflow's success.

on:
  push:
    branches:
      - main
    paths:
      - "backend/convex/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/convex-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Convex Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch-depth 2 so the rollback step can restore HEAD^'s backend
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sanity-check secret
        run: |
          if [ -z "${{ secrets.CONVEX_DEPLOY_KEY }}" ]; then
            echo "::error::CONVEX_DEPLOY_KEY repo secret is missing. Mirror it from Vercel env."
            exit 1
          fi
          echo "key-present=true"

      - name: Deploy Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --yes --typecheck=enable

      # Post-deploy smoke: run the golden-metrics query against the deployment
      # just pushed. Verifies (a) functions answer at all, (b) the response
      # carries the exact metric names (content signal), (c) tool-call-error-rate
      # is under the 0.05 critical threshold (HEALTH_CONFIG.errorRateCritical).
      - name: Smoke-check deployed functions
        id: smoke
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          OUT=$(npx convex run domains/operations/observability/goldenMetrics:getGoldenMetrics '{}')
          echo "$OUT"
          echo "$OUT" | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const m = JSON.parse(raw);
              if (!("tool-call-error-rate" in m) || !("p99-latency-ms" in m)) {
                console.error("::error::goldenMetrics response missing expected metric keys");
                process.exit(1);
              }
              if (m["tool-call-error-rate"] > 0.05) {
                console.error(`::error::tool-call-error-rate ${m["tool-call-error-rate"]} exceeds 0.05 critical threshold post-deploy`);
                process.exit(1);
              }
              console.log("Smoke OK: tool-call-error-rate =", m["tool-call-error-rate"]);
            });
          '

      # Rollback: Convex has no revision pinning, so rollback = redeploy the
      # previous commit's backend. Loud failure either way.
      - name: Roll back to previous backend
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          echo "::error::Post-deploy smoke check FAILED — redeploying HEAD^ backend"
          git checkout HEAD^ -- backend/convex shared || {
            echo "::error::Could not restore HEAD^ backend sources — MANUAL ROLLBACK REQUIRED (npx convex deploy from last green commit)"
            exit 1
          }
          npx convex deploy --yes --typecheck=disable
          echo "Rolled back Convex backend to HEAD^ sources."
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Convex deploy succeeded ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Convex deploy FAILED ❌" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Convex backend is now stale relative to frontend on \`main\`. The frontend deploy continues regardless. Investigate the build log above and either:" >> $GITHUB_STEP_SUMMARY
            echo "- Push a fix and let the next \`main\` push retry, or" >> $GITHUB_STEP_SUMMARY
            echo "- Manually run \`npx convex deploy\` once the cause is fixed." >> $GITHUB_STEP_SUMMARY
          fi
