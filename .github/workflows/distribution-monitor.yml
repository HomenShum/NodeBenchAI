name: Distribution Monitor

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday 9am UTC
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check npm downloads
        run: |
          echo "=== npm Downloads ==="
          curl -s "https://api.npmjs.org/downloads/point/last-week/nodebench-mcp" | jq '.'
          curl -s "https://api.npmjs.org/downloads/point/last-month/nodebench-mcp" | jq '.'
          echo ""
          echo "=== npm Package Info ==="
          curl -s "https://registry.npmjs.org/nodebench-mcp/latest" | jq '{name, version, description: .description[0:80]}'

      - name: Check Official MCP Registry
        run: |
          echo "=== MCP Registry ==="
          curl -s "https://registry.modelcontextprotocol.io/v0.1/servers?search=nodebench" | jq '.servers[0].server.name, .servers[0]._meta'

      - name: Check GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== GitHub Stars & Forks ==="
          # The repo's own name, not a literal: after the nodebench-ai -> NodeBenchAI rename the old URL answered 301 and
          # every stat came back null. -L follows any later redirect too.
          curl -sL -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}" | jq '{stars: .stargazers_count, forks: .forks_count, watchers: .subscribers_count, open_issues: .open_issues_count}'
          echo ""
          echo "=== Recent Release Downloads ==="
          curl -sL -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq '{tag: .tag_name, published: .published_at, message}'

      - name: Check directory listings
        run: |
          # A listing that moves or closes is a finding to print, not a failure: an error body (404/410) has no
          # title or labels, so read both null-safe and show GitHub's message.
          issue() {
            echo "=== $1 ==="
            curl -sL "https://api.github.com/repos/$2" | jq '{state, title: ((.title // "")[0:60]), labels: [(.labels // [])[].name], message}'
            echo ""
          }
          issue "Cline Marketplace Issue" cline/mcp-marketplace/issues/801
          issue "mcp.so Issue" chatmcp/mcpso/issues/693
          # awesome-mcp-servers turned Issues off (issue 2788 answers 410); the list itself is the listing.
          echo "=== awesome-mcp-servers README ==="
          echo "lines mentioning NodeBench: $(curl -sL https://raw.githubusercontent.com/punkpeye/awesome-mcp-servers/main/README.md | grep -ci nodebench || true)"

      - name: Summary
        run: |
          echo "============================================"
          echo " NodeBench MCP Distribution Dashboard"
          echo " $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "============================================"
          echo ""
          echo "Channels: npm, GitHub, Official MCP Registry,"
          echo "          Cline, awesome-mcp-servers, mcp.so,"
          echo "          mcpservers.org, Glama.ai, PulseMCP"
