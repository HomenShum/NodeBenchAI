name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for manually running the required CI gates"
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONVEX_URL: ${{ secrets.CONVEX_URL || vars.CONVEX_URL || 'https://agile-caribou-964.convex.cloud' }}
  VITE_CONVEX_URL: ${{ secrets.CONVEX_URL || vars.CONVEX_URL || 'https://agile-caribou-964.convex.cloud' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      # Needs no dependencies, so it runs before install and fails in ~1s.
      # Asserts every docs/START_HERE.md line citation and every .tours/ step
      # still points at the text it claims — not merely at a line that exists.
      - name: Walkthrough citations
        run: node scripts/validate-tours.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Convex bundle analysis (codegen)
        # `npx convex codegen` runs the same evaluate_push static analyzer
        # that `convex deploy` runs. Catches the class of bugs that landed
        # in production today: missing runtime deps (e.g. `uuid` in
        # devDependencies-only) and module-load-time failures in
        # transitive deps (e.g. @openai/agents-core/protocol.ts zod
        # constructor regression). Without this step, those bugs land
        # in main and only surface when Vercel-Production tries to push
        # the Convex bundle — at which point frontend deploys are stuck.
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex codegen

      - name: App typecheck
        run: npx tsc --noEmit --pretty false

      - name: Convex typecheck
        run: npx tsc -p backend/convex --noEmit --pretty false

  runtime-smoke:
    name: Runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Workflow event data scenarios
        run: node --test scripts/nodebench-packet-contracts.node.mjs

      - name: Runtime smoke tests
        run: >
          npx vitest run
          workers/node/lib/jsonObjectParser.test.ts
          workers/node/agentHarnessStructuredOutput.test.ts
          apps/web/src/features/product/lib/captureRouter.test.ts
          apps/web/src/features/workspace/lib/eventWorkspacePersistence.test.ts
          apps/web/src/features/workspace/data/eventWorkspaceMemory.test.ts
          backend/convex/__tests__/scratchnode.events.test.ts
          workers/node/searchRoute.test.ts
          backend/convex/workflows/ainewsBriefFormat.test.ts
          backend/convex/__tests__/agentRuntimeTierFallback.test.ts
          backend/convex/domains/mcp/mcpSourcingDraft.integration.test.ts
          backend/convex/domains/mcp/mcpExecutionTraceEndpoints.integration.test.ts
          backend/convex/domains/agents/mcp_tools/models/modelResolver.test.ts
          apps/web/src/features/agents/components/FastAgentPanel/__tests__/RunState.test.tsx
          backend/convex/domains/agents/autonomy/autonomy.integration.test.ts
          backend/convex/domains/agents/autonomy/autonomyTasteBench.integration.test.ts
          backend/convex/domains/evaluation/tasteBench.integration.test.ts
          backend/convex/domains/evaluation/tasteBenchPolicy.test.ts
          backend/convex/domains/product/diligenceTenantIsolation.test.ts
          apps/web/src/features/entities/components/notebook/entityNotebookAuthorityHelpers.test.ts
          apps/web/src/features/agents/authority/AuthorityControl.test.tsx
          apps/web/src/features/agents/authority/DelegatedReceiptRow.test.tsx
          apps/web/src/features/dogfood/components/TasteBenchPanel.test.tsx
          apps/web/src/features/evaluation/data/tasteBenchScenario.test.ts
          scripts/__tests__/releaseWorkflowContracts.test.ts
          backend/convex/domains/redesign/chatRuns.responseShape.test.ts
          backend/convex/domains/redesign/chatRuns.contract.test.ts
          apps/web/src/features/redesign/components/UniversalComposer.test.tsx
          apps/web/src/features/redesign/surfaces/ScratchnodeEventsSurface.test.tsx
          workers/node/pipelineRoute.test.ts
          workers/node/pipeline/searchPipeline.test.ts
          workers/node/searchPipelineStateToResultPacket.test.ts
          workers/node/streamingSearchRoute.test.ts
          apps/web/src/hooks/useStreamingSearch.test.ts
          apps/web/src/features/controlPlane/components/proofModel.test.ts

  scratchnode-launch-gates:
    name: ScratchNode launch gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify demo route gate and live route honesty
        run: >
          npx playwright test
          evals/e2e/vercel-preview-security.spec.ts
          evals/e2e/scratchnode-demo-route-gate.spec.ts
          evals/e2e/scratchnode-live-route-honesty.spec.ts
          --project=chromium
          --workers=1
          --reporter=list

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - typecheck
      - runtime-smoke
      - scratchnode-launch-gates
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Storybook build
        run: npm run build-storybook

      - name: Retained Storybook index
        run: npm run storybook:verify:index

  pipeline-honest-pair:
    name: Pipeline honest-failure paired proof
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/pipeline-honest-failure-20261008'
    runs-on: ubuntu-latest
    # Three <=600s children, owned drainage and artifact-upload headroom.
    # Existing job/test timeouts and default Vitest worker policy remain intact.
    timeout-minutes: 35
    env:
      CONVEX_URL: ""
      VITE_CONVEX_URL: ""
    steps:
      # Read current main, then require exact authentic 8b in the source guard.
      # Checking out an old SHA alone would conceal intervening main changes.
      - uses: actions/checkout@v6
        with:
          ref: main
          path: pipeline-pair/baseline
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
