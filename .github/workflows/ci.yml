              function finish() {
                if (completed) return;
                completed = true;
                [deadline, poll, closeTimer, killTimer].forEach((timer) => { if (timer) { clearTimeout(timer); clearInterval(timer); } });
                resolve();
              }
              function maybeFinish() {
                if (record.childClosed && record.streamsEnded.stdout && record.streamsEnded.stderr && record.jsonDrained) finish();
              }
              function capture(name, data, cap) {
                counts[name].received += data.length;
                if (counts[name].written + data.length > cap) { stop(name + "-cap"); return; }
                try {
                  let offset = 0;
                  while (offset < data.length) { const n = fs.writeSync(fds[name], data, offset, data.length - offset); check(n > 0, "No capture progress"); offset += n; counts[name].written += n; }
                } catch (error) { stop(name + "-write:" + error.code); }
              }
              try {
                ["stdout", "stderr"].forEach((name) => { fds[name] = fs.openSync(path.join(phase, name + ".log"), "wx"); });
                if (framework) {
                  fifo = path.join(phase, "framework.fifo");
                  local("mkfifo", ["--", fifo], cwd);
                  check(fs.lstatSync(fifo).isFIFO(), "JSON FIFO type");
                  // No blocking open/read: zero before reporter startup is not completion.
                  jsonFd = fs.openSync(fifo, fs.constants.O_RDONLY | fs.constants.O_NONBLOCK);
                  fds.json = fs.openSync(path.join(phase, "vitest-actual-results.json"), "wx");
                  const block = Buffer.alloc(65536);
                  poll = setInterval(() => {
                    try {
                      for (let i = 0; i < 64; i++) {
                        let n;
                        try { n = fs.readSync(jsonFd, block, 0, block.length, null); }
                        catch (error) { if (error.code === "EAGAIN" || error.code === "EWOULDBLOCK") break; throw error; }
                        if (n === 0) { if (record.childClosed) record.jsonDrained = true; break; }
                        capture("json", block.subarray(0, n), MAX_JSON);
                        if (record.stopReasons.length) break;
                      }
                      maybeFinish();
                    } catch (error) { stop("json-read:" + error.code); }
                  }, 10);
                  args = [...args, "--outputFile", fifo]; record.args = args;
                }
                deadline = setTimeout(() => stop("role-deadline"), ROLE_MS);
                child = spawn(executable, args, { cwd, env, shell: false, detached: true, stdio: ["ignore", "pipe", "pipe"] });
                child.once("spawn", () => { record.invocationCount = 1; record.pid = child.pid; });
                child.once("error", (error) => { record.launchError = error.code || error.message; stop("launch-error"); });
                ["stdout", "stderr"].forEach((name) => {
                  child[name].on("data", (data) => capture(name, data, MAX_STREAM));
                  child[name].once("end", () => { record.streamsEnded[name] = true; maybeFinish(); });
                  child[name].once("error", (error) => stop(name + "-stream:" + error.code));
                });
                child.once("exit", (code, signal) => {
                  record.nativeExit = { code, signal, observedUtc: new Date().toISOString() };
                  try { fs.writeFileSync(path.join(phase, "native-exit.json"), JSON.stringify(record.nativeExit), { flag: "wx" }); }
                  catch (error) { stop("native-exit-write:" + error.code); }
                  armClose();
                });
                child.once("close", () => { record.childClosed = true; armClose(); maybeFinish(); });
              } catch (error) { record.launchError = error.code || error.message; stop("prelaunch-error"); }
            });
            try { await done; }
            finally {
              if (jsonFd !== undefined) { try { fs.closeSync(jsonFd); } catch (error) { record.stopReasons.push("fifo-close:" + error.code); } }
              for (const fd of Object.values(fds)) { try { fs.closeSync(fd); } catch (error) { record.stopReasons.push("capture-close:" + error.code); } }
              if (fifo && fs.existsSync(fifo)) { check(fs.lstatSync(fifo).isFIFO(), "Owned FIFO changed type"); fs.unlinkSync(fifo); }
            }
            record.elapsedMs = performance.now() - started;
            record.completeRawStreams = record.childClosed && record.streamsEnded.stdout && record.streamsEnded.stderr && record.stopReasons.length === 0;
            record.frameworkCompleteCapture = !framework || (record.jsonDrained && counts.json.written > 0 && counts.json.received === counts.json.written && record.stopReasons.length === 0);
            record.files = {};
            ["stdout.log", "stderr.log", ...(framework ? ["vitest-actual-results.json"] : [])].forEach((name) => { const file = path.join(phase, name); if (fs.existsSync(file)) record.files[name] = hashFile(file, MAX_STREAM); });
            writeJson(label + "-capture.json", record); summary.phases[label] = record;
            check(record.invocationCount === 1 && record.nativeExit && record.completeRawStreams && record.frameworkCompleteCapture, "Incomplete phase: " + label);
            return { record, phase };
          }

          function parseFramework(run, role, expectedExit) {
            check(run.record.nativeExit.code === expectedExit && !run.record.nativeExit.signal, "Unexpected native framework exit");
            const file = path.join(run.phase, "vitest-actual-results.json");
            const stat = fs.statSync(file);
            check(stat.size > 0 && stat.size <= MAX_JSON, "Framework JSON size");
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            check(Array.isArray(report.testResults) && report.testResults.length === SUITES.length, "Framework file inventory");
            const remaining = new Set(SUITES);
            const identities = [];
            let passed = 0, failed = 0;
            for (const result of report.testResults) {
              const relative = path.relative(role, result.name).replace(/\\/g, "/");
              check(remaining.has(relative), "Missing/extra framework file"); remaining.delete(relative);
              check(result.message === "" && ["passed", "failed"].includes(result.status), "File load/setup error");
              check(Array.isArray(result.assertionResults) && result.assertionResults.length > 0 && result.assertionResults.length <= 2048, "Assertion inventory cap");
              const source = fs.readFileSync(path.join(role, relative), "utf8").split("\n");
              const allowedLines = new Set();
              source.forEach((line, index) => { if (line.includes("expect(")) for (let i = Math.max(1, index - 1); i <= Math.min(source.length, index + 9); i++) allowedLines.add(i); });
              for (const item of result.assertionResults) {
                check(identities.length < 4096 && typeof item.fullName === "string" && item.fullName.length <= 8192 && ["passed", "failed"].includes(item.status), "Identity/status cap or skip");
                check(Array.isArray(item.failureMessages) && item.failureMessages.length <= 16 && item.failureMessages.every((message) => typeof message === "string" && message.length <= 131072), "Failure message cap");
                if (item.status === "passed") { passed++; check(item.failureMessages.length === 0, "Passing row with errors"); }
                else {
                  failed++; check(item.failureMessages.length > 0, "Failure without cause");
                  const escaped = result.name.replace(/[.*+?^\x24{}()|[\]\\]/g, "\\$&");
                  const locations = new RegExp(escaped + ":(\\d+):\\d+", "g");
                  for (const message of item.failureMessages) {
                    check(!/\b(beforeAll|beforeEach|afterAll|afterEach|drainRoutes|configure)\b|Hook timed out|Failed to load|Cannot find module/i.test(message), "Hook/setup/load failure");
                    const matches = [...message.matchAll(locations)];
                    const assertion = /^AssertionError\b/.test(message) && matches.some((match) => allowedLines.has(Number(match[1])));
                    const authoredTimeout = relative === SUITES[0] && (
                      (item.fullName === ROUTE_NAMES[26] && /^Error: Test timed out in 65000ms\b/.test(message)) ||
                      (item.fullName === ROUTE_NAMES[33] && /^Error: Test timed out in 75000ms\b/.test(message))
                    );
                    check(assertion || authoredTimeout, "Unclassified within-test failure; root review required");
                  }
                }
                identities.push({ file: relative, fullName: item.fullName, status: item.status, failureCount: item.failureMessages.length, failureMessagesSha256: digest(Buffer.from(JSON.stringify(item.failureMessages))) });
              }
              check(result.status === (result.assertionResults.some((item) => item.status === "failed") ? "failed" : "passed"), "File status disagreement");
            }
            check(remaining.size === 0 && report.numTotalTests === identities.length && report.numPassedTests === passed && report.numFailedTests === failed && report.numPendingTests === 0 && report.numTodoTests === 0, "Framework counters/skip disagreement");
            const route = identities.filter((item) => item.file === SUITES[0]).map((item) => item.fullName).sort();
            check(JSON.stringify(route) === JSON.stringify([...ROUTE_NAMES].sort()), "Exact desired50 route multiset");
            const raw = ["stdout.log", "stderr.log"].map((name) => fs.readFileSync(path.join(run.phase, name), "utf8").replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, "")).join("\n");
            check(!/Vitest caught .*unhandled|Unhandled Errors|Unhandled Rejection|Uncaught Exception/i.test(raw), "Unhandled framework error");
            check(expectedExit === 1 ? failed > 0 && report.success === false : failed === 0 && report.success === true, "Expected negative/candidate criterion");
            return { passed, failed, identities, rawFramework: run.record.files["vitest-actual-results.json"] };
          }
          (async () => {
            try {
              check(git(baseline, ["rev-parse", "HEAD"]).toString().trim() === BASE && git(baseline, ["rev-parse", "HEAD^{tree}"]).toString().trim() === BASE_TREE, "Current main moved; fixed authentic baseline unavailable");
              check(git(candidate, ["rev-parse", "HEAD"]).toString().trim() === expectedHead, "Candidate head mismatch");
              const beforeTree = tree(baseline), afterTree = tree(candidate);
              check(beforeTree.size === 6853 && afterTree.size === 6855, "Complete leaf counts");
              const admitted = new Set([...Object.keys(AFTER), CI_OWNER]);
              let changed = 0, same = 0, added = 0;
              for (const [file, value] of beforeTree) {
                const next = afterTree.get(file);
                check(next && value.mode === next.mode && value.type === next.type, "Removed or changed leaf type");
                if (next.sha === value.sha) { same++; check(!admitted.has(file), "Required owner unexpectedly unchanged"); }
                else { changed++; check(admitted.has(file), "Outside owner changed"); }
              }
              for (const [file, value] of afterTree) if (!beforeTree.has(file)) { added++; check(admitted.has(file) && value.mode === "100644" && value.type === "blob", "Outside/addition type"); }
              check(changed === 12 && added === 2 && same === 6841, "Exact fourteen projection");
              for (const [file, sha] of Object.entries(AFTER)) check(afterTree.get(file).sha === sha && blobFile(path.join(candidate, file)) === sha, "Frozen non-CI source mismatch: " + file);
              for (const [file, sha] of Object.entries(GRAPH_INPUTS)) check(beforeTree.get(file).sha === sha && afterTree.get(file).sha === sha && blobFile(path.join(baseline, file)) === sha && blobFile(path.join(candidate, file)) === sha, "Graph/config source mismatch");
              for (const file of [".npmrc", ".nvmrc"]) check(beforeTree.get(file) && afterTree.get(file) && beforeTree.get(file).sha === afterTree.get(file).sha && blobFile(path.join(baseline, file)) === beforeTree.get(file).sha && blobFile(path.join(candidate, file)) === afterTree.get(file).sha, "Peer/runtime policy changed");
              for (const role of [baseline, candidate]) for (const file of [".env", ".env.local", ".env.test", ".env.test.local", ".env.production"]) check(!fs.existsSync(path.join(role, file)), "Auto-loaded env file present; values not read");
              status(candidate, false);
              check(git(baseline, ["status", "--porcelain=v1", "-z", "--untracked-files=normal"]).length === 0, "Baseline checkout dirty before overlay");
              summary.source = { baselineTree: BASE_TREE, candidateTree: git(candidate, ["rev-parse", "HEAD^{tree}"]).toString().trim(), actualCI: { blob: afterTree.get(CI_OWNER).sha, ...hashFile(path.join(candidate, CI_OWNER)) }, changed, added, same, circularSelfPin: false, externalRootComparison: "Required exact finalCI/tree/job/head comparison" };
              summary.versions = { node: process.version, nodeExecutable: process.execPath, nodeHash: hashFile(process.execPath, 256 * 1024 * 1024), npm: local("npm", ["--version"], candidate).toString().trim(), declaredPackageManager: JSON.parse(fs.readFileSync(path.join(candidate, "package.json"), "utf8")).packageManager, policy: "Existing .nvmrc/bundled npm, same actual Linux graph; not prior Windows pinned runtime proof" };
              summary.beforeInstallMemory = memorySnapshot();
              const originalCandidate = signature(candidate, afterTree);
              const installEnv = cleanEnv("install");
              delete installEnv.NODE_ENV;
              delete installEnv.NODEBENCH_DATA_DIR;
              const install = await owned("install", "npm", ["ci", "--no-audit", "--no-fund"], candidate, installEnv, false);
              check(install.record.nativeExit.code === 0 && !install.record.nativeExit.signal, "Normal npm ci failed; no fallback");
              status(candidate, false);
              check(JSON.stringify(originalCandidate) === JSON.stringify(signature(candidate, afterTree)), "Install changed tracked source/lock/config");
              for (const file of OVERLAYS) { const target = path.join(baseline, file); check(blobFile(path.join(candidate, file)) === AFTER[file], "Desired overlay not frozen"); fs.writeFileSync(target, fs.readFileSync(path.join(candidate, file))); }
              check(!fs.existsSync(path.join(baseline, "node_modules")), "Baseline graph path not absent");
              fs.symlinkSync(path.join(candidate, "node_modules"), path.join(baseline, "node_modules"), "dir");
              check(fs.realpathSync(path.join(baseline, "node_modules")) === fs.realpathSync(path.join(candidate, "node_modules")), "Graph attachment mismatch");
              const graph = installedGraph();
              summary.installedGraph = graph;
              const versions = {};
              for (const pkg of ["vitest", "express", "jsdom", "@vitejs/plugin-react"]) versions[pkg] = JSON.parse(fs.readFileSync(path.join(candidate, "node_modules", pkg, "package.json"), "utf8")).version;
              check(versions.vitest === "4.1.11", "Actual reporter schema differs from reviewed Vitest4.1.11");
              summary.installedVersions = versions;
              check(graph["node_modules/vitest/dist/chunks/index.UpGiHP7g.js"].sha256 === "cdafaf8e508042dddba72f8c7bbae84e2836ddb6b06c7026520c35d91af4e798", "Reviewed JSON reporter implementation changed");
              const parsed = {};
              for (const [label, role, leaves, expectedExit] of [["baseline", baseline, beforeTree, 1], ["candidate", candidate, afterTree, 0]]) {
                status(role, label === "baseline");
                const sourceBefore = signature(role, leaves), cacheBefore = cacheMetadata(), memoryBefore = memorySnapshot();
                check(JSON.stringify(graph) === JSON.stringify(installedGraph()), "Graph preguard changed");
                const env = cleanEnv(label);
                const args = [path.join(role, "node_modules/vitest/vitest.mjs"), "run", ...SUITES, "--reporter=default", "--reporter=json"];
                const run = await owned(label, process.execPath, args, role, env, true);
                status(role, label === "baseline");
                check(JSON.stringify(sourceBefore) === JSON.stringify(signature(role, leaves)), "Role source/config drift");
                check(JSON.stringify(graph) === JSON.stringify(installedGraph()), "Role installed immutable graph drift");
                check(fs.readdirSync(env.NODEBENCH_DATA_DIR).length === 0 && !fs.existsSync(path.join(role, ".tmp")), "Unexpected real persistence");
                parsed[label] = parseFramework(run, role, expectedExit);
                writeJson(label + "-observed.json", { sourceBefore, sourceAfter: signature(role, leaves), graph, allowedCacheBefore: cacheBefore, allowedCacheAfter: cacheMetadata(), memoryBefore, memoryAfter: memorySnapshot(), results: parsed[label], scope: "Selected immutable graph bindings only; normal cache metadata writes allowed" });
              }
              const keys = (value) => value.identities.map((row) => row.file + "\0" + row.fullName).sort();
              check(JSON.stringify(keys(parsed.baseline)) === JSON.stringify(keys(parsed.candidate)), "Six-suite identity multiset changed");
              summary.comparison = { baseline: parsed.baseline, candidate: parsed.candidate, identityMultiset: "EXACT", rawFullFailureMessages: "Retained complete in bounded native frameworkJSON; summaries retain hashes, never truncate raw failure data" };
              summary.status = "CONTROLLED_PAIRED_CRITERION_PASS";
            } catch (error) {
              summary.status = "STOP_OR_FAILURE"; summary.failure = { message: error.message, stack: error.stack }; process.exitCode = 1;
            } finally {
              summary.completedUtc = new Date().toISOString();
              writeJson("comparison-summary.json", summary);
              console.log(JSON.stringify({ status: summary.status, proofOutput: output, baseline: BASE, candidate: expectedHead, failure: summary.failure?.message || null }));
            }
          })();

          PIPELINE_PAIR_NODE

      - name: Preserve complete paired evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-honest-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pipeline-honest-pair/*-capture.json
            ${{ runner.temp }}/pipeline-honest-pair/*-observed.json
            ${{ runner.temp }}/pipeline-honest-pair/comparison-summary.json
            ${{ runner.temp }}/pipeline-honest-pair/install/*.log
            ${{ runner.temp }}/pipeline-honest-pair/install/native-exit.json
            ${{ runner.temp }}/pipeline-honest-pair/baseline/*.log
            ${{ runner.temp }}/pipeline-honest-pair/baseline/*.json
            ${{ runner.temp }}/pipeline-honest-pair/candidate/*.log
            ${{ runner.temp }}/pipeline-honest-pair/candidate/*.json
          if-no-files-found: error
          retention-days: 14
