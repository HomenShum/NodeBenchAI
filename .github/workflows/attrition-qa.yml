name: Attrition QA
# Runs after every deploy to verify NodeBench quality

on:
  # After Vercel deploy completes
  deployment_status:
  # Manual trigger
  workflow_dispatch:
    inputs:
      api_url:
        description: 'NodeBench API URL'
        default: 'https://scratchnode.live'

jobs:
  qa-crawl:
    name: Surface crawl
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Crawl all surfaces
        env:
          BASE: ${{ github.event.inputs.api_url || 'https://scratchnode.live' }}
        run: |
          set -o pipefail
          if [[ "$BASE" == https://vercel.com/* ]]; then
            BASE="https://scratchnode.live"
          fi
          BASE="${BASE%/}"
          echo "Crawling $BASE"

          SURFACES=("ask" "library" "connect" "telemetry")
          ERRORS=0

          for surface in "${SURFACES[@]}"; do
            STATUS=$(curl -L -sS --retry 2 --retry-delay 2 --connect-timeout 10 -o /dev/null -w "%{http_code}" "$BASE/?surface=$surface" --max-time 30)
            if [ "$STATUS" = "200" ]; then
              echo "PASS $surface: $STATUS"
            else
              echo "FAIL $surface: $STATUS"
              ERRORS=$((ERRORS + 1))
            fi
          done

          # curl >=8.4 enforces max-filesize while receiving unknown-length bodies.
          export CURL_VERSION="$(curl --version)"
          node -e '
            const version = /^curl (\d+)\.(\d+)\./.exec(process.env.CURL_VERSION || "");
            if (!version || Number(version[1]) < 8 || (Number(version[1]) === 8 && Number(version[2]) < 4)) {
              throw new Error("Public health requires curl >=8.4 for the response-size bound");
            }
          '
          curl -sS --globoff --proto '=https' --connect-timeout 10 --max-time 30 --max-filesize 65536 --write-out '\n%{http_code}' -- "$BASE/api/search-health" | node --input-type=module -e '
            const chunks = [];
            let bytes = 0;
            for await (const chunk of process.stdin) {
              bytes += chunk.length;
              if (bytes > 65540) throw new Error("Public health exceeds the response-size bound");
              chunks.push(chunk);
            }
            const response = Buffer.concat(chunks);
            if (!response.subarray(-4).equals(Buffer.from("\n200"))) throw new Error("Public health must return HTTP200");
            const body = new TextDecoder("utf-8", { fatal: true }).decode(response.subarray(0, -4));
            const health = JSON.parse(body);
            if (!health || typeof health !== "object" || Array.isArray(health) || health.status !== "ok" ||
                !Number.isSafeInteger(health.toolsExpected) || health.toolsExpected < 1 ||
                !Number.isSafeInteger(health.toolsAvailable) || health.toolsAvailable !== health.toolsExpected ||
                !Array.isArray(health.tools) || health.tools.length !== health.toolsAvailable ||
                !health.tools.every(name => typeof name === "string" && name.length > 0 && name === name.trim()) ||
                new Set(health.tools).size !== health.tools.length) {
              throw new Error("Public search health is incomplete or malformed");
            }
          '
          echo "PASS public search health"

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS surface(s) failed health check"
            exit 1
          fi

  golden-queries:
    name: Pipeline quality benchmark
    runs-on: ubuntu-latest
    needs: qa-crawl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund || npm install --ignore-scripts --no-audit --no-fund

      - name: Verify benchmark runner scenarios
        run: node --test scripts/attrition/golden-runtime-scenarios.mjs

      - name: Run golden queries
        env:
          NODEBENCH_API_URL: ${{ github.event.inputs.api_url || 'https://scratchnode.live' }}
        run: |
          if [[ "$NODEBENCH_API_URL" == https://vercel.com/* ]]; then
            export NODEBENCH_API_URL="https://scratchnode.live"
          fi
          npx tsx scripts/attrition/run-golden-queries.ts

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-query-results
          path: scripts/attrition/golden-results.json

      - name: Comment results on PR (if applicable)
        if: github.event.pull_request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('scripts/attrition/golden-results.json', 'utf8'));
            const body = results.status === 'blocked'
              ? `## NodeBench Quality Benchmark\n\n**Not run:** ${results.notRun} queries.\n\nRuntime preflight failed: ${results.message}\n\nNo answer-quality score was produced.`
              : `## NodeBench Quality Benchmark

            **Pass rate:** ${results.passed}/${results.total} (${results.passRate}%)
            **Avg confidence:** ${results.avgConfidence}%
            **Avg latency:** ${results.avgLatency}ms

            ${results.results.filter(r => !r.passed).map(r =>
              `❌ **${r.id}**: ${r.failures.join(', ')}`
            ).join('\n')}

            ${results.results.filter(r => r.passed).map(r =>
              `✅ **${r.id}**: ${r.confidence}% conf, ${r.signals} signals, ${r.sources} sources`
            ).join('\n')}
            `;
            if (context.issue?.number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
