name: Post-Deploy Verify

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to verify"
        required: false
        default: "https://www.nodebenchai.com"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: post-deploy-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # On deployment_status events, only run when state is success. Production
    # events are verified through the canonical public hostname; only known
    # Preview environments may explicitly skip when SSO has no bypass secret.
    if: |
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Resolve URL
        id: url
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DISPATCH_URL: ${{ github.event.inputs.url }}
        run: |
          ALLOW_PREVIEW_SKIP=false
          if [ "${{ github.event_name }}" = "deployment_status" ]; then
            if [ "${DEPLOYMENT_ENVIRONMENT,,}" = "production" ]; then
              URL="https://www.nodebenchai.com"
            else
              URL="$DEPLOYMENT_URL"
              ALLOW_PREVIEW_SKIP=true
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL="$DISPATCH_URL"
          else
            URL="https://www.nodebenchai.com"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "allow_preview_skip=$ALLOW_PREVIEW_SKIP" >> "$GITHUB_OUTPUT"
          echo "Verifying deployment environment '${DEPLOYMENT_ENVIRONMENT:-scheduled/manual}' at $URL"

      - name: Verify deployed app
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ALLOW_PROTECTED_PREVIEW_SKIP: ${{ steps.url.outputs.allow_preview_skip }}
        run: node scripts/post-deploy-verify.mjs --url=${{ steps.url.outputs.url }} --json > post-deploy-result.json

      # Automatic rollback: when verification of a PRODUCTION deployment_status
      # event fails, roll Vercel back to the previous production deployment.
      # Scheduled/manual runs verify but never roll back (the failure may be
      # unrelated to a fresh deploy). Fails loudly if the token is missing.
      - name: Roll back Vercel production deploy
        if: >-
          failure() &&
          github.event_name == 'deployment_status' &&
          (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Production verification FAILED and VERCEL_TOKEN / VERCEL_PROJECT_ID secrets are missing — CANNOT roll back automatically. Roll back in the Vercel dashboard now."
            exit 1
          fi
          npx vercel@latest rollback --yes --token "$VERCEL_TOKEN"
          echo "::error::Production verification FAILED — rolled back to the previous Vercel production deployment."

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: post-deploy-result-${{ github.run_id }}
          path: post-deploy-result.json
          retention-days: 30
